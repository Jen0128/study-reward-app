<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>💖 讀書與健身獎勵系統</title>
  
  <script src="config.js"></script>
  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- 身分驗證 -->
  <div id="loginView" class="card">
    <h2>🔒 身分驗證</h2>
    <p>請選擇您的身分並輸入 4 位數 PIN 碼：</p>
    <select id="roleSelect">
      <option value="bf">👦 男朋友 (打卡/兌換/倉庫)</option>
      <option value="gf">👧 女朋友 (審核/履約/點數/商店管理)</option>
    </select>
    <input type="password" id="pinInput" placeholder="輸入 PIN 碼" maxlength="4">
    <button class="btn" onclick="login()">登入系統</button>
  </div>

  <!-- 主應用介面 -->
  <div id="appView" class="hidden">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span id="roleBadge" class="badge bg-approved">身分已驗證</span>
          <h2 style="margin: 5px 0 0;" id="ptsDisplay">🏆 餘額：<span id="totalPoints">0</span> 點</h2>
        </div>
        <div style="display:flex; gap: 5px;">
          <button id="btnAdjustPts" class="btn btn-secondary btn-sm hidden" onclick="adjustPointsModal()" style="border-radius:8px; background:#f39c12;">± 點數</button>
          <button class="btn btn-secondary btn-sm" onclick="logout()" style="border-radius:8px;">切換帳號</button>
        </div>
      </div>
    </div>

    <!-- 男朋友介面 -->
    <div id="bfView" class="hidden">
      <div id="tabBfCheckin">
        <div class="card">
          <h3>📝 任務打卡 (本週次數限制)</h3>
          <div id="taskList">載入中...</div>
        </div>
      </div>

      <div id="tabBfStore" class="hidden">
        <div class="card">
          <h3>🎁 獎勵商店</h3>
          <div id="storeGrid" class="store-grid">載入中...</div>
        </div>
      </div>

      <div id="tabBfInventory" class="hidden">
        <div class="card">
          <h3>📦 我的倉庫 (兌換與抽獎紀錄)</h3>
          <div id="inventoryList">載入中...</div>
        </div>
      </div>

      <div class="nav-bar">
        <button id="navBfCheckin" class="nav-item active" onclick="switchBfTab('Checkin')">📝 打卡</button>
        <button id="navBfStore" class="nav-item" onclick="switchBfTab('Store')">🎁 商店</button>
        <button id="navBfInventory" class="nav-item" onclick="switchBfTab('Inventory')">📦 倉庫</button>
      </div>
    </div>

    <!-- 女朋友介面 -->
    <div id="gfView" class="hidden">
      <div id="tabGfAudit">
        <div class="card">
          <h3>🔍 待審核打卡紀錄</h3>
          <div id="auditList">載入中...</div>
        </div>
      </div>

      <div id="tabGfRedeem" class="hidden">
        <div class="card">
          <h3>🛍️ 男友兌換申請 (待履約)</h3>
          <div id="redeemList">載入中...</div>
        </div>
      </div>

      <div id="tabGfManageStore" class="hidden">
        <div class="card">
          <h3>🎁 商店品項管理</h3>
          <button class="btn btn-success" onclick="openAddProductModal()" style="margin-bottom:15px;">➕ 新增商品品項</button>
          <div id="gfStoreAdminList">載入中...</div>
        </div>
      </div>

      <div class="nav-bar">
        <button id="navGfAudit" class="nav-item active" onclick="switchGfTab('Audit')">🔍 審核打卡</button>
        <button id="navGfRedeem" class="nav-item" onclick="switchGfTab('Redeem')">🛍️ 兌換履約</button>
        <button id="navGfManageStore" class="nav-item" onclick="switchGfTab('ManageStore')">🎁 商店管理</button>
      </div>
    </div>
  </div>

  <!-- 打卡 Modal -->
  <div id="checkinModal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="modal-close" onclick="closeModal()">✖</span>
      <h3 id="modalTaskTitle" style="margin-bottom: 15px; padding-right: 20px;">提交任務打卡</h3>
      <p style="font-size: 14px; margin-bottom: 5px;"><b>📝 任務描述：</b></p>
      <textarea id="modalTaskDesc" placeholder="例如：微積分 CH3 練習題..." rows="3"></textarea>
      <p style="font-size: 14px; margin-bottom: 5px; margin-top: 10px;"><b>📸 上傳證明照片：</b></p>
      <input type="file" id="modalPhotoInput" accept="image/*">
      <button class="btn btn-success" style="margin-top: 15px;" onclick="confirmSubmitCheckin()">提交給女友審核</button>
    </div>
  </div>

  <!-- 新增商品 Modal -->
  <div id="addProductModal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="modal-close" onclick="closeAddProductModal()">✖</span>
      <h3 style="margin-bottom: 15px;">新增獎勵商品</h3>
      <p style="font-size: 14px; margin-bottom: 2px;"><b>品項名稱：</b></p>
      <input type="text" id="newProdName" placeholder="例如：CITY CAFE 冰拿鐵">
      <p style="font-size: 14px; margin-bottom: 2px;"><b>所需點數：</b></p>
      <input type="number" id="newProdPts" placeholder="例如：11">
      <p style="font-size: 14px; margin-bottom: 2px;"><b>商品圖片：</b></p>
      <input type="file" id="newProdPhoto" accept="image/*">
      <button class="btn btn-success" style="margin-top: 15px;" onclick="saveNewProduct()">確認上架</button>
    </div>
  </div>

  <script>
    const API_URL = CONFIG.API_URL;
    const PIN_BF = CONFIG.PIN_BF; 
    const PIN_GF = CONFIG.PIN_GF; 

    let activeTask = null;
    let userLogs = []; 
    let storeProducts = []; 

    const TASKS = [
      { id: 't1', name: '每天完成讀書計劃', pts: 2, limit: 7 },
      { id: 't2', name: '迷你讀書 (30分鐘)', pts: 1, limit: 7 },
      { id: 't3', name: '去健身房有氧30分鐘', pts: 2, limit: 7 },
      { id: 't4', name: '重訓/伸展 20分鐘', pts: 1, limit: 5 },
      { id: 't5', name: '上班打卡', pts: 1, limit: 7 },
      { id: 't6', name: '打掃房間', pts: 3, limit: 1 },
      { id: 't7', name: '好好放鬆 1 小時', pts: 1, limit: 3 },
      { id: 't8', name: '多喝水達標 2000c.c.', pts: 1, limit: 7 },
      { id: 't9', name: '早睡保養 (12:00前)', pts: 1, limit: 7 },
      { id: 't10', name: '表達感謝讚美/甜蜜互動', pts: 1, limit: 7 },
      { id: 't11', name: '分享生活有趣小事', pts: 1, limit: 7 },
      { id: 't12', name: '規劃下次約會行程', pts: 2, limit: 2 }
    ];

    let currentRole = localStorage.getItem('user_role') || '';

    function login() {
      const role = document.getElementById('roleSelect').value;
      const pin = document.getElementById('pinInput').value;

      if ((role === 'bf' && pin === PIN_BF) || (role === 'gf' && pin === PIN_GF)) {
        currentRole = role;
        localStorage.setItem('user_role', role);
        initView();
      } else {
        Swal.fire('錯誤', 'PIN 碼不正確！', 'error');
      }
    }

    function logout() {
      localStorage.removeItem('user_role');
      location.reload();
    }

    function initView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');

      if (currentRole === 'gf') {
        document.getElementById('roleBadge').innerText = '👧 女朋友權限';
        document.getElementById('gfView').classList.remove('hidden');
        document.getElementById('bfView').classList.add('hidden');
        document.getElementById('btnAdjustPts').classList.remove('hidden');
      } else {
        document.getElementById('roleBadge').innerText = '👦 男朋友權限';
        document.getElementById('bfView').classList.remove('hidden');
        document.getElementById('gfView').classList.add('hidden');
        document.getElementById('btnAdjustPts').classList.add('hidden');
      }

      loadData();
    }

    function renderTasks() {
      let html = '';
      TASKS.forEach(t => {
        const pendingItem = userLogs.find(l => l.items && l.items.includes(t.name) && l.status === 'Pending');
        const approvedCount = userLogs.filter(l => l.items && l.items.includes(t.name) && l.status === 'Approved').length;

        let btnHtml = '';
        if (pendingItem) {
          btnHtml = `<button class="btn btn-sm status-btn-pending">待驗證</button>`;
        } else if (approvedCount >= t.limit) {
          btnHtml = `<button class="btn btn-sm status-btn-done">已完成</button>`;
        } else {
          btnHtml = `<button class="btn btn-sm status-btn-todo" onclick="openCheckinModal('${t.name}', ${t.pts})">未完成</button>`;
        }

        html += `
          <div class="task-item">
            <div class="task-info">
              <span class="task-title">${t.name} (+${t.pts}點)</span>
              <span class="task-sub">週上限 ${t.limit} 次</span>
            </div>
            ${btnHtml}
          </div>
        `;
      });
      document.getElementById('taskList').innerHTML = html;
    }

    function formatImgUrl(url) {
      if (!url) return 'https://via.placeholder.com/150';
      // 如果是 Base64 格式直接回傳
      if (url.startsWith('data:image')) return url;
      
      // 如果是 Google Drive 檔案，提取 File ID 轉為通用跨域圖片連結
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      }
      return url;
    }

    function renderStore() {
      let html = '';
      storeProducts.forEach(p => {
        html += `
          <div class="product-card">
            <img src="${formatImgUrl(p.img)}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
            <div class="product-name">${p.name}</div>
            <div class="product-pts">點數：${p.pts}</div>
            <button class="btn btn-success btn-sm product-btn" onclick="redeem('${p.name}', ${p.pts})">兌換</button>
          </div>
        `;
      });
      document.getElementById('storeGrid').innerHTML = html || '<p style="color:#718096; grid-column:span 2;">目前尚無上架商品～</p>';
    }

    function renderGfStoreAdmin() {
      let html = '';
      storeProducts.forEach(p => {
        html += `
          <div class="task-item">
            <img src="${formatImgUrl(p.img)}" style="width:45px; height:45px; border-radius:8px; object-fit:cover; margin-right:10px;" onerror="this.src='https://via.placeholder.com/150'">
            <div class="task-info" style="flex:1;">
              <span class="task-title">${p.name}</span>
              <span class="task-sub">需要 ${p.pts} 點</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">刪除</button>
          </div>
        `;
      });
      document.getElementById('gfStoreAdminList').innerHTML = html || '<p style="color:#718096;">尚無商品，請點擊上方按鈕新增！</p>';
    }

    function openAddProductModal() {
      document.getElementById('newProdName').value = '';
      document.getElementById('newProdPts').value = '';
      document.getElementById('newProdPhoto').value = '';
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function closeAddProductModal() {
      document.getElementById('addProductModal').classList.add('hidden');
    }

    async function saveNewProduct() {
      const name = document.getElementById('newProdName').value;
      const pts = parseFloat(document.getElementById('newProdPts').value);
      const photoFile = document.getElementById('newProdPhoto').files[0];

      if (!name || isNaN(pts) || pts <= 0) return Swal.fire('提示', '請填寫正確品項名稱與點數！', 'warning');
      if (!photoFile) return Swal.fire('提示', '請上傳商品圖片！', 'warning');

      Swal.fire({ title: '同步新增至雲端...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const imgBase64 = await compressImage(photoFile);
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'addProduct',
            name: name,
            pts: pts,
            imgBase64: imgBase64
          })
        });
        closeAddProductModal();
        Swal.fire('成功', '商品已同步發布至男友商店！', 'success');
        loadData();
      } catch (e) {
        Swal.fire('錯誤', '圖片處理失敗，請重試！', 'error');
      }
    }

    async function deleteProduct(id) {
      Swal.fire({
        title: '確定刪除此商品？',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: '刪除'
      }).then(async (res) => {
        if (res.isConfirmed) {
          Swal.fire({ title: '刪除中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'deleteProduct', id: id })
          });
          Swal.fire('已刪除', '品項已下架！', 'success');
          loadData();
        }
      });
    }

    function openCheckinModal(name, pts) {
      activeTask = { name, pts };
      document.getElementById('modalTaskTitle').innerText = `提交【${name}】打卡`;
      document.getElementById('modalTaskDesc').value = '';
      document.getElementById('modalPhotoInput').value = '';
      document.getElementById('checkinModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('checkinModal').classList.add('hidden');
      activeTask = null;
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxWidth = 800;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    async function confirmSubmitCheckin() {
      const desc = document.getElementById('modalTaskDesc').value;
      if (!desc) return Swal.fire('提示', '請填寫任務描述說明！', 'warning');

      const photoFile = document.getElementById('modalPhotoInput').files[0];
      if (!photoFile) return Swal.fire('提示', '請上傳證明照片！', 'warning');

      if (!activeTask) return Swal.fire('錯誤', '任務資料遺失，請重新點擊！', 'error');
      const currentTask = activeTask;
      closeModal();

      Swal.fire({ title: '壓縮與上傳中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const photoBase64 = await compressImage(photoFile);

        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submit',
            items: [currentTask.name],
            points: currentTask.pts,
            photoBase64: photoBase64,
            desc: desc
          })
        });

        Swal.fire('提交成功！', '請等待女友審核發放點數～', 'success');
        loadData();
      } catch (err) {
        Swal.fire('提交失敗', `錯誤訊息：${err.message || err}`, 'error');
      }
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        userLogs = data.logs || [];
        storeProducts = data.products || [];
      } catch (e) {
        console.warn("後端 API 取得失敗，使用當前本地暫存");
      }

      let currentPts = 0;
      let totalEarnedPts = 0;
      let auditHtml = '';
      let redeemHtml = '';
      let inventoryHtml = '';

      userLogs.slice().reverse().forEach(log => {
        const pts = parseFloat(log.points || 0);

        // 已通過審核的項目
        if (log.status === 'Approved') {
          currentPts += pts;
          if (pts > 0) totalEarnedPts += pts; // 計算歷史正向累積點數
        }

        // 女友端：待審核任務打卡 (pts > 0)
        if (log.status === 'Pending' && pts > 0 && currentRole === 'gf') {
          auditHtml += `
            <div style="border-bottom: 1px solid #edf2f7; padding: 10px 0;">
              <p style="margin:2px 0;"><b>時間：</b>${log.date}</p>
              <p style="margin:2px 0;"><b>項目：</b>${log.items} (+${pts}點)</p>
              <p style="margin:2px 0;"><b>說明：</b>${log.desc || '無'}</p>
              ${log.photoUrl ? `<a href="${log.photoUrl}" target="_blank"><img src="${log.photoUrl}" style="max-width:100%; border-radius:8px; margin-top:5px;"></a>` : ''}
              <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn btn-success btn-sm" style="flex:1;" onclick="audit('${log.id}', 'approve')">同意 ✅</button>
                <button class="btn btn-danger btn-sm" style="flex:1;" onclick="audit('${log.id}', 'reject')">退件 ❌</button>
              </div>
            </div>
          `;
        }

        // 女友端：待履約兌換申請 (pts < 0)
        if (log.status === 'Pending' && pts < 0 && currentRole === 'gf') {
          redeemHtml += `
            <div style="border-bottom: 1px solid #edf2f7; padding: 10px 0;">
              <p style="margin:2px 0;"><b>時間：</b>${log.date}</p>
              <p style="margin:2px 0;"><b>申請兌換：</b>${log.items} (扣除 ${Math.abs(pts)} 點)</p>
              <button class="btn btn-success btn-sm" onclick="audit('${log.id}', 'approve')">完成履約 ✅</button>
            </div>
          `;
        }

        // 男友端：倉庫紀錄（包括待履約與已完成履約）
        if (pts < 0 || (log.items && log.items.includes('抽獎'))) {
          const isApproved = log.status === 'Approved';
          const badgeClass = isApproved ? 'bg-approved' : 'bg-pending';
          const badgeText = isApproved ? '已完成' : '待履行';

          inventoryHtml += `
            <div class="task-item">
              <div class="task-info">
                <span class="task-title">🎁 ${log.items}</span>
                <span class="task-sub">申請時間：${log.date}</span>
              </div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
          `;
        }
      });

      document.getElementById('totalPoints').innerText = currentPts;
      document.getElementById('auditList').innerHTML = auditHtml || '<p style="color:#718096;">目前沒有待審核的打卡～</p>';
      document.getElementById('redeemList').innerHTML = redeemHtml || '<p style="color:#718096;">目前沒有待履約的兌換～</p>';
      document.getElementById('inventoryList').innerHTML = inventoryHtml || '<p style="color:#718096;">倉庫空空如也～</p>';

      renderTasks();
      renderStore();
      renderGfStoreAdmin();
      checkWheelMilestone(totalEarnedPts);
    }

    // 檢查 30 點不可重複抽獎邏輯
    function checkWheelMilestone(totalEarned) {
      if (totalEarned < 30 || currentRole !== 'bf') return;

      const currentMilestone = Math.floor(totalEarned / 30) * 30; // 目前達到的最高30倍數 (30, 60, 90...)
      const lastDrawnMilestone = parseInt(localStorage.getItem('last_wheel_milestone') || '0');

      if (currentMilestone > lastDrawnMilestone) {
        Swal.fire({
          title: '🎉 達標免費抽獎！',
          text: `恭喜累積達到 ${currentMilestone} 點！獲得 1 次免費抽獎機會！`,
          icon: 'star',
          confirmButtonText: '立刻抽獎'
        }).then(() => {
          triggerFreeSpin(currentMilestone);
        });
      }
    }

    function triggerFreeSpin(milestone) {
      const prizes = ['CITY CAFE 咖啡', '神秘小禮物', '肩頸按摩 20分鐘', '手作曲奇餅乾', '神秘獎勵'];
      const result = prizes[Math.floor(Math.random() * prizes.length)];

      Swal.fire({
        title: '🎲 抽獎中...',
        timer: 2000,
        didOpen: () => Swal.showLoading()
      }).then(async () => {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        localStorage.setItem('last_wheel_milestone', milestone.toString());

        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submit',
            items: [`[抽獎獲得] ${result}`],
            points: 0,
            desc: `達標 ${milestone} 點免費抽獎獎勵`
          })
        });

        Swal.fire('🎉 抽獎結果', `恭喜抽中：<b>${result}</b>！已放入倉庫～`, 'success');
        loadData();
      });
    }

    async function adjustPointsModal() {
      const { value: formValues } = await Swal.fire({
        title: '⚙️ 女友手動調整點數',
        html:
          '<input id="swal-pts" type="number" class="swal2-input" placeholder="輸入數值 (如 +5 或 -3)">' +
          '<input id="swal-reason" type="text" class="swal2-input" placeholder="輸入原因">',
        focusConfirm: false,
        showCancelButton: true,
        preConfirm: () => [
          document.getElementById('swal-pts').value,
          document.getElementById('swal-reason').value
        ]
      });

      if (formValues) {
        const pts = parseFloat(formValues[0]);
        const reason = formValues[1];
        if (isNaN(pts) || !reason) return Swal.fire('提示', '請填寫正確點數與原因！', 'warning');

        Swal.fire({ title: '調整中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submit',
            items: [`[手動調整] ${reason}`],
            points: pts,
            desc: `調整點數：${pts}`
          })
        });

        Swal.fire('完成', '點數已調整！', 'success');
        loadData();
      }
    }

    async function audit(id, auditAction) {
      let reason = '';
      if (auditAction === 'reject') {
        const { value: text } = await Swal.fire({
          title: '退件原因',
          input: 'text',
          showCancelButton: true
        });
        if (!text) return;
        reason = text;
      }

      Swal.fire({ title: '更新狀態中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'audit', id: id, auditAction: auditAction, reason: reason })
      });
      Swal.fire('完成', '狀態已更新！', 'success');
      loadData();
    }

    async function redeem(name, pts) {
      const currentPts = parseFloat(document.getElementById('totalPoints').innerText);
      if (currentPts < pts) return Swal.fire('點數不足', `需要 ${pts} 點，目前僅有 ${currentPts} 點`, 'warning');

      Swal.fire({
        title: '確認兌換？',
        text: `將申請兌換【${name}】(預扣 ${pts} 點)`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '確認兌換'
      }).then(async (res) => {
        if (res.isConfirmed) {
          Swal.fire({ title: '送出申請中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'redeem', rewardName: name, points: pts })
          });
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          Swal.fire('兌換申請已送出！', '請等待女友審核與履約～', 'success');
          loadData();
        }
      });
    }

    function switchBfTab(tab) {
      ['Checkin', 'Store', 'Inventory'].forEach(t => {
        document.getElementById('tabBf' + t).classList.add('hidden');
        document.getElementById('navBf' + t).classList.remove('active');
      });
      document.getElementById('tabBf' + tab).classList.remove('hidden');
      document.getElementById('navBf' + tab).classList.add('active');
    }

    function switchGfTab(tab) {
      ['Audit', 'Redeem', 'ManageStore'].forEach(t => {
        document.getElementById('tabGf' + t).classList.add('hidden');
        document.getElementById('navGf' + t).classList.remove('active');
      });
      document.getElementById('tabGf' + tab).classList.remove('hidden');
      document.getElementById('navGf' + tab).classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    if (currentRole) initView();
  </script>
</body>
</html>
