<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>💖 讀書與健身獎勵系統</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root { --primary: #4a90e2; --bg: #f7f9fc; --card: #ffffff; --text: #2c3e50; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px 15px 80px; color: var(--text); -webkit-tap-highlight-color: transparent; }
    .card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 18px; }
    h2, h3 { margin-top: 0; color: var(--primary); }
    .hidden { display: none !important; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; box-sizing: border-box; }
    .btn-danger { background: #e74c3c; }
    .btn-success { background: #2ecc71; }
    .btn-secondary { background: #95a5a6; }
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #edf2f7; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; margin-top: 5px; margin-bottom: 10px; font-size: 15px; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; }
    .bg-pending { background: #fef3c7; color: #d97706; }
    .bg-approved { background: #d1fae5; color: #059669; }
    .bg-rejected { background: #fee2e2; color: #dc2626; }
    .wheel-container { text-align: center; margin: 15px 0; }
    .wheel { width: 220px; height: 220px; border-radius: 50%; border: 8px solid var(--primary); margin: 0 auto; display: flex; align-items: center; justify-content: center; font-weight: bold; background: conic-gradient(#3498db 0 36deg, #e74c3c 36deg 72deg, #f1c40f 72deg 108deg, #2ecc71 108deg 144deg, #9b59b6 144deg 180deg, #e67e22 180deg 216deg, #1abc9c 216deg 252deg, #34495e 252deg 288deg, #7f8c8d 288deg 324deg, #d35400 324deg 360deg); transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.6); }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; }
    .nav-item { border: none; background: none; font-size: 12px; color: #718096; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. 登入介面 -->
  <div id="loginView" class="card">
    <h2>🔒 身分驗證</h2>
    <p>請選擇您的身分並輸入 4 位數 PIN 碼：</p>
    <select id="roleSelect">
      <option value="bf">👦 男朋友 (打卡/兌換)</option>
      <option value="gf">👧 女朋友 (審核/管理)</option>
    </select>
    <input type="password" id="pinInput" placeholder="輸入 PIN 碼 (預設: 1111/8888)" maxlength="4">
    <button class="btn" onclick="login()">登入系統</button>
  </div>

  <!-- 2. 主程式區域 -->
  <div id="appView" class="hidden">
    
    <!-- 點數儀表板 -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span id="roleBadge" class="badge bg-approved">身分已驗證</span>
          <h2 style="margin: 5px 0 0;">🏆 餘額：<span id="totalPoints">0</span> 點</h2>
        </div>
        <button class="btn btn-secondary" onclick="logout()" style="width: auto; padding: 6px 12px; font-size: 12px;">切換帳號</button>
      </div>
      <p style="margin: 5px 0 0; font-size: 13px; color: #718096;">可抽獎次數：<b id="drawCount">0</b> 次 (10點/次)</p>
    </div>

    <!-- 男友打卡頁面 -->
    <div id="tabCheckin">
      <div class="card">
        <h3>📝 任務打卡 (本週次數限制)</h3>
        <form id="checkinForm">
          <div id="taskList"></div>
          
          <p><b>📝 任務描述 (如：讀書章節、健身內容、打掃區域)：</b></p>
          <textarea id="taskDesc" placeholder="例如：微積分 CH3 練習題、有氧跑步機 30 分鐘..." required></textarea>

          <p><b>📸 上傳證明照片：</b></p>
          <input type="file" id="photoInput" accept="image/*" required>

          <button type="button" class="btn" onclick="submitCheckin()">提交給女友審核</button>
        </form>
      </div>
    </div>

    <!-- 女友審核頁面 -->
    <div id="tabAudit" class="hidden">
      <div class="card">
        <h3>🔍 待審核清單</h3>
        <div id="auditList">載入中...</div>
      </div>
    </div>

    <!-- 獎勵商店與兌換頁面 -->
    <div id="tabStore" class="hidden">
      <div class="card">
        <h3>🎁 獎勵商店</h3>
        <div id="storeList"></div>
      </div>
    </div>

    <!-- 抽獎輪盤頁面 -->
    <div id="tabWheel" class="hidden">
      <div class="card" style="text-align: center;">
        <h3>🎲 幸運抽獎輪盤</h3>
        <p style="font-size: 13px; color: #718096;">每次抽獎消耗 10 點</p>
        <div class="wheel-container">
          <div id="wheel" class="wheel">點擊抽獎</div>
        </div>
        <button class="btn" onclick="spinWheel()">開始抽獎 (10點)</button>
      </div>
    </div>

    <!-- 底部導覽列 -->
    <div class="nav-bar">
      <button class="nav-item active" onclick="switchTab('Checkin')">📝 打卡</button>
      <button class="nav-item" onclick="switchTab('Store')">🎁 商店</button>
      <button class="nav-item" onclick="switchTab('Wheel')">🎲 輪盤</button>
      <button id="navAuditBtn" class="nav-item hidden" onclick="switchTab('Audit')">🔍 審核</button>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyZ8ls-B00xg4CiSlTJo9-dRCg3kn21xEtSeKk1isLSQD3lko9PtTabPLrQhIfuuTguow/exec";
    const PIN_BF = "1111"; // 男友預設 PIN 碼
    const PIN_GF = "8888"; // 女友預設 PIN 碼

    // 任務清單設定 (每週上限)
    const TASKS = [
      { id: 't1', name: '每天完成讀書計劃', pts: 2, limit: 7 },
      { id: 't2', name: '迷你讀書 (30分鐘)', pts: 1, limit: 7 },
      { id: 't3', name: '去健身房有氧30分鐘', pts: 2, limit: 7 },
      { id: 't4', name: '重訓/伸展 20分鐘', pts: 1, limit: 5 },
      { id: 't5', name: '上班打卡', pts: 1, limit: 7 },
      { id: 't6', name: '打掃房間', pts: 3, limit: 1 },
      { id: 't7', name: '好好放鬆 1 小時', pts: 1, limit: 3 },
      { id: 't8', name: '多喝水達標 2000c.c.', pts: 1, limit: 7 },
      { id: 't9', name: '早睡保養 (12:00前)', pts: 1, limit: 7 },
      { id: 't10', name: '表達感謝讚美/甜蜜互動', pts: 1, limit: 7 },
      { id: 't11', name: '分享生活有趣小事', pts: 1, limit: 7 },
      { id: 't12', name: '規劃下次約會行程', pts: 2, limit: 2 }
    ];

    // 預設商店清單
    const STORE_ITEMS = [
      { name: '【7-11】CITY CAFE 冰美式咖啡(大)', pts: 9, type: '小獎' },
      { name: '【7-11】CITY CAFE 冰拿鐵咖啡(大)', pts: 11, type: '小獎' },
      { name: '【7-11】西西里風檸檬氣泡咖啡', pts: 16, type: '小獎' },
      { name: '【7-11】光泉高蛋白奶大麥蛋白飲', pts: 9, type: '小獎' },
      { name: '【7-11】卜蜂義式香草雞胸肉', pts: 12, type: '小獎' },
      { name: '一起連線玩遊戲 1 小時', pts: 5, type: '小獎' },
      { name: '手作曲奇餅乾（減糖高蛋白版）', pts: 25, type: '中獎' },
      { name: '肩頸肌肉放鬆按摩 20 分鐘', pts: 20, type: '中獎' },
      { name: '一次外送券（限額 $150）', pts: 30, type: '中獎' },
      { name: '一日陪讀 / 陪放空行程', pts: 25, type: '中獎' },
      { name: '蛋白粉一包（口味任選）', pts: 120, type: '中獎', url: 'https://tw.shp.ee/YP6XMKPT' },
      { name: '健身專業裝備任選', pts: 100, type: '中獎' },
      { name: '🔒 終極大獎 (預留空位 - 明年3月解鎖)', pts: 999, type: '大獎', locked: true }
    ];

    let currentRole = localStorage.getItem('user_role') || '';

    function login() {
      const role = document.getElementById('roleSelect').value;
      const pin = document.getElementById('pinInput').value;

      if ((role === 'bf' && pin === PIN_BF) || (role === 'gf' && pin === PIN_GF)) {
        currentRole = role;
        localStorage.setItem('user_role', role);
        initView();
      } else {
        Swal.fire('錯誤', 'PIN 碼不正確！', 'error');
      }
    }

    function logout() {
      localStorage.removeItem('user_role');
      location.reload();
    }

    function initView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');

      if (currentRole === 'gf') {
        document.getElementById('roleBadge').innerText = '👧 女朋友權限';
        document.getElementById('navAuditBtn').classList.remove('hidden');
      } else {
        document.getElementById('roleBadge').innerText = '👦 男朋友權限';
      }

      renderTasks();
      renderStore();
      loadData();
    }

    function renderTasks() {
      let html = '';
      TASKS.forEach(t => {
        html += `
          <div class="task-item">
            <label><input type="checkbox" name="task" value="${t.pts}" data-name="${t.name}"> ${t.name} (+${t.pts}點)</label>
            <span style="font-size: 12px; color: #718096;">週上限 ${t.limit} 次</span>
          </div>
        `;
      });
      document.getElementById('taskList').innerHTML = html;
    }

    function renderStore() {
      let html = '';
      STORE_ITEMS.forEach(item => {
        html += `
          <div class="task-item">
            <div>
              <b>${item.name}</b> ${item.url ? `<a href="${item.url}" target="_blank">🔗 連結</a>` : ''}
              <br><span style="font-size:12px; color:#718096;">需要 ${item.pts} 點</span>
            </div>
            <button class="btn btn-success" style="width:auto; padding:6px 12px;" onclick="redeem('${item.name}', ${item.pts}, ${item.locked})">兌換</button>
          </div>
        `;
      });
      document.getElementById('storeList').innerHTML = html;
    }

    function switchTab(tabName) {
      ['Checkin', 'Store', 'Wheel', 'Audit'].forEach(t => {
        const el = document.getElementById('tab' + t);
        if (el) el.classList.add('hidden');
      });
      document.getElementById('tab' + tabName).classList.remove('hidden');
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function submitCheckin() {
      const cbs = document.querySelectorAll('input[name="task"]:checked');
      if (cbs.length === 0) return Swal.fire('提示', '請至少選擇一項任務！', 'warning');
      
      const desc = document.getElementById('taskDesc').value;
      if (!desc) return Swal.fire('提示', '請填寫任務描述說明！', 'warning');

      const photoFile = document.getElementById('photoInput').files[0];
      if (!photoFile) return Swal.fire('提示', '請上傳證明照片！', 'warning');

      Swal.fire({ title: '上傳中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      const items = [];
      let points = 0;
      cbs.forEach(cb => {
        items.push(cb.getAttribute('data-name'));
        points += parseFloat(cb.value);
      });

      const photoBase64 = await getBase64(photoFile);

      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'submit',
          items: items,
          points: points,
          photoBase64: photoBase64,
          desc: desc
        })
      });

      Swal.fire('提交成功！', '請等待女友審核發放點數～', 'success');
      loadData();
    }

    async function loadData() {
      const res = await fetch(API_URL);
      const logs = await res.json();

      let approvedPts = 0;
      let auditHtml = '';

      logs.reverse().forEach(log => {
        if (log.status === 'Approved') {
          approvedPts += parseFloat(log.points);
        } else if (log.status === 'Pending' && currentRole === 'gf') {
          auditHtml += `
            <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
              <p><b>${log.date}</b></p>
              <p>項目：${log.items} (${log.points}點)</p>
              <p>說明：${log.desc}</p>
              ${log.photoUrl ? `<a href="${log.photoUrl}" target="_blank"><img src="${log.photoUrl}" style="max-width:100%; border-radius:8px;"></a>` : ''}
              <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn btn-success" onclick="audit('${log.id}', 'approve')">同意 ✅</button>
                <button class="btn btn-danger" onclick="audit('${log.id}', 'reject')">退件 ❌</button>
              </div>
            </div>
          `;
        }
      });

      document.getElementById('totalPoints').innerText = approvedPts;
      document.getElementById('drawCount').innerText = Math.floor(approvedPts / 10);
      document.getElementById('auditList').innerHTML = auditHtml || '<p>目前沒有待審核的打卡～</p>';
    }

    async function audit(id, action) {
      let reason = '';
      if (action === 'reject') {
        const { value: text } = await Swal.fire({
          title: '退件原因',
          input: 'text',
          inputPlaceholder: '例如：照片模糊/描述太少',
          showCancelButton: true
        });
        if (!text) return;
        reason = text;
      }

      Swal.fire({ title: '處理中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: action, id: id, reason: reason })
      });
      Swal.fire('完成', '審核狀態已更新', 'success');
      loadData();
    }

    async function redeem(name, pts, locked) {
      if (locked) return Swal.fire('鎖定中', '終極大獎需至 2027/03/31 且達 25% 總點數門檻才可兌換！', 'info');
      
      const currentPts = parseFloat(document.getElementById('totalPoints').innerText);
      if (currentPts < pts) return Swal.fire('點數不足', `兌換需要 ${pts} 點，目前僅有 ${currentPts} 點`, 'warning');

      Swal.fire({ title: '兌換中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'redeem', rewardName: name, points: pts })
      });
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      Swal.fire('兌換成功！', `已兌換 ${name}，請找女友履約！`, 'success');
      loadData();
    }

    function spinWheel() {
      const currentPts = parseFloat(document.getElementById('totalPoints').innerText);
      if (currentPts < 10) return Swal.fire('點數不足', '抽獎需要 10 點！', 'warning');

      const wheel = document.getElementById('wheel');
      const degrees = 1800 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${degrees}deg)`;

      setTimeout(() => {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        Swal.fire('🎉 抽獎結果', '恭喜獲得【銘謝惠顧！明天繼續加油💪】', 'success');
      }, 3000);
    }

    // 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    if (currentRole) initView();
  </script>
</body>
</html>
