<body>

  <!-- 身分驗證 Modal -->
  <div id="loginModal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="modal-close" onclick="closeLoginModal()">✖</span>
      <h3>🔒 身分驗證</h3>
      <select id="roleSelect">
        <option value="bf">阿寶</option>
        <option value="gf">小天使</option>
      </select>
      <input type="password" id="pinInput" placeholder="輸入密碼" maxlength="4">
      <button class="btn" onclick="login()">切換</button>
    </div>
  </div>

  <!-- 主應用介面 -->
  <div id="appView">
    <div class="card top-header-card">
      <div class="header-main-row">
        <div class="header-title-group" onclick="openLoginModal()" title="點擊切換身分權限">

          <span id="roleBadge" class="header-title-text">阿寶充電站</span>
        </div>

        <div class="pts-pill-badge" id="ptsDisplay">

          <span class="pts-pill-num" id="totalPoints">0</span>
        </div>
      </div>

      <button id="btnAdjustPts" class="btn btn-secondary btn-sm hidden" onclick="adjustPointsModal()" style="margin-top:10px; background:#f39c12; width:100%;">⚙️ 女手動調整點數</button>
    </div>

    <div id="bfView" class="hidden">

      </div>

      <div id="tabBfCheckin">
        <div class="card">
          <h3>任務牆</h3>
          <div id="taskList">載入中...</div>
        </div>
      </div>

      <div id="tabBfStore" class="hidden">
        <div class="card">
          <h3>獎勵商店</h3>
          <div id="storeGrid" class="store-grid">載入中...</div>
        </div>
      </div>

      <div id="tabBfInventory" class="hidden">
        <div class="card">
          <h3>我的倉庫</h3>
          <div id="inventoryList">載入中...</div>

      </div>

      <div class="nav-bar">

        <button id="navBfStore" class="nav-item" onclick="switchBfTab('Store')">🎁 商店</button>
        <button id="navBfInventory" class="nav-item" onclick="switchBfTab('Inventory')">📦 倉庫</button>

    </div>

    <!-- 女朋友介面 -->

  <!-- 打卡 Modal -->
  <div id="checkinModal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="modal-close" onclick="closeModal()">✖</span>
      <h3 id="modalTaskTitle" style="margin-bottom: 15px; padding-right: 20px;">提交任務打卡</h3>
      <p style="font-size: 14px; margin-bottom: 5px;"><b>任務描述：</b></p>
      <textarea id="modalTaskDesc" placeholder="例如：微積分 CH3 練習題..." rows="3"></textarea>
      <p style="font-size: 14px; margin-bottom: 5px; margin-top: 10px;"><b>上傳證明：</b></p>
      <input type="file" id="modalPhotoInput" accept="image/*">

    </div>

  <!-- 新增/編輯商品 Modal -->

    <div class="modal-card">
      <span class="modal-close" onclick="closeAddProductModal()">✖</span>
      <h3 id="productModalTitle" style="margin-bottom: 15px;">新增獎勵商品</h3>
      <input type="hidden" id="editProductId">
      
      <p style="font-size: 14px; margin-bottom: 2px;"><b>店家/品牌名稱：</b></p>
      <input type="text" id="newProdStore" placeholder="例如：【7-ELEVEN】">
      
      <p style="font-size: 14px; margin-bottom: 2px;"><b>品項名稱：</b></p>
      <input type="text" id="newProdName" placeholder="例如：冰美式咖啡(大)">
      
      <p style="font-size: 14px; margin-bottom: 2px;"><b>所需點數：</b></p>
      <input type="number" id="newProdPts" placeholder="例如：9">
      
      <p style="font-size: 14px; margin-bottom: 2px;"><b>商品圖片：</b></p>
      <input type="file" id="newProdPhoto" accept="image/*">
      <button class="btn btn-success" style="margin-top: 15px;" onclick="saveProduct()">確認儲存</button>
    </div>
  </div>

  <div id="wheelModal" class="modal-overlay hidden">
    <div class="modal-card" style="text-align: center;">

      <div class="wheel-wrapper">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
      </div>

      <button id="spinBtn" class="btn btn-success" style="margin-top: 15px;" onclick="spinWheel()">開始旋轉！</button>
    </div>
  </div>

    ];

    const TASKS = [
      { id: 't1', name: '每日讀書計畫完成', pts: 2, limit: 7 },
      { id: 't2', name: '迷你讀書 (30分鐘)', pts: 1, limit: 7 },
      { id: 't3', name: '有氧30分鐘', pts: 2, limit: 7 },
      { id: 't4', name: '重訓 30分鐘', pts: 1, limit: 5 },
      { id: 't5', name: '上班', pts: 1, limit: 7 },
      { id: 't6', name: '打掃房間', pts: 3, limit: 1 },
      { id: 't7', name: '好好放鬆 1 小時', pts: 1, limit: 3 },
      { id: 't8', name: '喝水 2000c.c.', pts: 1, limit: 7 },
      { id: 't9', name: '12:00前睡覺', pts: 1, limit: 7 },
      { id: 't10', name: '規劃下次約會行程', pts: 5, limit: 1 },
      { id: 't11', name: '分享生活有趣小事', pts: 1, limit: 7 }
    ];

    let currentRole = localStorage.getItem('user_role') || 'bf';

    // 格式化日期時間：例如 2026/07/27 下午07:14
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;

      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? '下午' : '上午';
      
      hours = hours % 12;
      hours = hours ? hours : 12; // 12 小時制
      const formattedHours = String(hours).padStart(2, '0');

      return `${year}/${month}/${day} ${ampm}${formattedHours}:${minutes}`;
    }

    function initDailyQuote() {
      const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const seed = parseInt(todayStr);
      const quoteIndex = seed % QUOTES.length;
      document.getElementById('dailyQuoteText').innerText = QUOTES[quoteIndex];
    }

    function openLoginModal() {
      document.getElementById('pinInput').value = '';
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function login() {
      const role = document.getElementById('roleSelect').value;
      const pin = document.getElementById('pinInput').value;

      if ((role === 'bf' && pin === PIN_BF) || (role === 'gf' && pin === PIN_GF)) {
        currentRole = role;
        localStorage.setItem('user_role', role);
        closeLoginModal();
        initView();
        Swal.fire({ icon: 'success', title: '身分切換成功', timer: 1200, showConfirmButton: false });
      } else {
        Swal.fire('錯誤', 'PIN 碼不正確！', 'error');
      }
    }

    function initView() {
      if (currentRole === 'gf') {
        document.getElementById('roleBadge').innerText = '👧 女朋友權限';
        document.getElementById('gfView').classList.remove('hidden');
        document.getElementById('bfView').classList.add('hidden');
        document.getElementById('btnAdjustPts').classList.remove('hidden');
      } else {
        document.getElementById('roleBadge').innerText = '阿寶充電站';
        document.getElementById('bfView').classList.remove('hidden');
        document.getElementById('gfView').classList.add('hidden');
        document.getElementById('btnAdjustPts').classList.add('hidden');
      }

      initDailyQuote();
      loadData();
    }

    function formatImgUrl(url) {
      if (!url) return 'https://via.placeholder.com/150';
      if (url.startsWith('data:image')) return url;
      
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      }
      return url;
    }

    function renderTasks() {
      let html = '';
      TASKS.forEach(t => {
        const pendingItem = userLogs.find(l => l.items && l.items.includes(t.name) && l.status === 'Pending');
        const approvedCount = userLogs.filter(l => l.items && l.items.includes(t.name) && l.status === 'Approved').length;

        let btnHtml = '';
        if (pendingItem) {
          btnHtml = `<button class="btn btn-sm status-btn-pending">待驗證</button>`;
        } else if (approvedCount >= t.limit) {
          btnHtml = `<button class="btn btn-sm status-btn-done">已完成</button>`;
        } else {
          btnHtml = `<button class="btn btn-sm status-btn-todo" onclick="openCheckinModal('${t.name}', ${t.pts})">未完成</button>`;
        }

        html += `
          <div class="task-item">
            <div class="task-info">
              <span class="task-title">${t.name} (+${t.pts}點)</span>
              <span class="task-sub">週上限 ${t.limit} 次</span>
            </div>
            ${btnHtml}
          </div>
        `;
      });
      document.getElementById('taskList').innerHTML = html;
    }

    function renderStore() {
      const currentPts = parseFloat(document.getElementById('totalPoints').innerText || 0);
      const wheelExchangeable = Math.floor(currentPts / 5);
      
      // 固定第一格：幸運轉盤 (改為色卡中的淡紫到茶黃漸層卡片，按鈕改為 Royal Blue 皇室藍)

        <div class="product-card" style="background: linear-gradient(135deg, rgba(188, 164, 245, 0.25) 0%, rgba(236, 255, 190, 0.4) 100%); border: 1.5px solid var(--mauve);">

          <div class="product-title-group">
            <div class="product-name">幸運大轉盤 (1次)</div>
          </div>
          <div class="product-pts-info">
            <span class="product-pts">點數：5</span>
            <span class="product-exchangeable">(可換 ${wheelExchangeable} 次)</span>
          </div>
          <button class="btn btn-sm product-btn" style="background: var(--dark-accent);" onclick="redeemWheel()">立刻抽獎</button>
        </div>
      `;
      
      // 渲染其他上架商品
      storeProducts.forEach(p => {
        const storeDisplay = p.store ? `<div class="product-store">${p.store}</div>` : '';
        const exchangeableCount = p.pts > 0 ? Math.floor(currentPts / p.pts) : 0;
        const fullName = p.store ? `${p.store} ${p.name}` : p.name;

        html += `
          <div class="product-card">
            <img src="${formatImgUrl(p.img)}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
            <div class="product-title-group">
              ${storeDisplay}
              <div class="product-name">${p.name}</div>
            </div>
            <div class="product-pts-info">
              <span class="product-pts">點數：${p.pts}</span>
              <span class="product-exchangeable">(可換 ${exchangeableCount} 個)</span>
            </div>
            <button class="btn btn-success btn-sm product-btn" onclick="redeem('${fullName}', ${p.pts})">兌換</button>
          </div>
        `;
      });
      document.getElementById('storeGrid').innerHTML = html;
    }

    // 2. 商店 5 點兌換轉盤 (免女友審核，直接扣點並開轉)
    let isStorePaidWheel = false; // 標記是否為商店付費抽獎

    async function redeemWheel() {
      const currentPts = parseFloat(document.getElementById('totalPoints').innerText || 0);
      if (currentPts < 5) return Swal.fire('點數不足', '幸運轉盤需要 5 點，目前點數不足！', 'warning');

      Swal.fire({
        title: '🎲 兌換幸運轉盤？',
        text: '點擊確認將立刻扣除 5 點並開啟轉盤！',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '確認兌換 (-5點)',
        cancelButtonText: '取消'
      }).then(async (res) => {
        if (res.isConfirmed) {
          Swal.fire({ title: '即時扣點中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

          // 發送 storeSpin，直接寫入 Approved 狀態，實扣 5 點
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'storeSpin' })
          });

          isStorePaidWheel = true;
          pendingMilestone = 0; 
          
          // 重新載入最新餘額 (餘額會立刻少 5 點)
          await loadData();
          
          // 關閉 Loading 彈窗並開啟轉盤
          Swal.close();
          document.getElementById('wheelModal').classList.remove('hidden');
          drawWheel();
        }
      });
    }

              <span class="task-sub">需要 ${p.pts} 點</span>
            </div>
            <div style="display:flex; gap:5px;">
              <button class="btn btn-secondary btn-sm" onclick="openEditProductModal('${p.id}')">編輯</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">刪除</button>
            </div>
          </div>
        `;
      });
      
      const adminListEl = document.getElementById('gfStoreAdminList');
      adminListEl.innerHTML = html || '<p style="color:#718096;">尚無商品，請點擊上方按鈕新增！</p>';

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(adminListEl, {
        animation: 150,
        handle: '.drag-handle',
        onEnd: async function () {
          const newOrderMap = {};
          const items = adminListEl.querySelectorAll('.draggable-item');
          items.forEach((el, index) => {
            newOrderMap[el.getAttribute('data-id')] = index + 1;
          });

          Swal.fire({ title: '儲存排序中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'updateOrder', orderMap: newOrderMap })
          });
          Swal.fire('成功', '商品順序已更新！', 'success');
          loadData();
        }
      });
    }

    function openAddProductModal() {
      document.getElementById('productModalTitle').innerText = '新增獎勵商品';
      document.getElementById('editProductId').value = '';
      document.getElementById('newProdStore').value = '【7-ELEVEN】';
      document.getElementById('newProdName').value = '';
      document.getElementById('newProdPts').value = '';
      document.getElementById('newProdPhoto').value = '';
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function openEditProductModal(id) {
      const prod = storeProducts.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('productModalTitle').innerText = '編輯獎勵商品';
      document.getElementById('editProductId').value = prod.id;
      document.getElementById('newProdStore').value = prod.store || '';
      document.getElementById('newProdName').value = prod.name;
      document.getElementById('newProdPts').value = prod.pts;
      document.getElementById('newProdPhoto').value = '';
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function closeAddProductModal() {
      document.getElementById('addProductModal').classList.add('hidden');
    }

    async function saveProduct() {
      const editId = document.getElementById('editProductId').value;
      const store = document.getElementById('newProdStore').value || '';
      const name = document.getElementById('newProdName').value;
      const pts = parseFloat(document.getElementById('newProdPts').value);
      const photoFile = document.getElementById('newProdPhoto').files[0];

      if (!name || isNaN(pts) || pts <= 0) return Swal.fire('提示', '請填寫正確品項名稱與點數！', 'warning');

      Swal.fire({ title: '同步雲端中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        let imgBase64 = null;
        if (photoFile) {
          imgBase64 = await compressImage(photoFile);
        }

        const action = editId ? 'editProduct' : 'addProduct';
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: action,
            id: editId,
            store: store,
            name: name,
            pts: pts,
            imgBase64: imgBase64
          })
        });

        closeAddProductModal();
        Swal.fire('成功', '商品資料已更新！', 'success');
        loadData();
      } catch (e) {
        Swal.fire('錯誤', '處理失敗，請重試！', 'error');
      }
    }

    async function deleteProduct(id) {
      Swal.fire({
        title: '確定刪除此商品？',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: '刪除'
      }).then(async (res) => {
        if (res.isConfirmed) {
          Swal.fire({ title: '刪除中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'deleteProduct', id: id })
          });
          Swal.fire('已刪除', '品項已下架！', 'success');
          loadData();
        }
      });
    }

    function openCheckinModal(name, pts) {
      activeTask = { name, pts };
      document.getElementById('modalTaskTitle').innerText = `提交【${name}】打卡`;
      document.getElementById('modalTaskDesc').value = '';
      document.getElementById('modalPhotoInput').value = '';
      document.getElementById('checkinModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('checkinModal').classList.add('hidden');
      activeTask = null;
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxWidth = 800;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    async function confirmSubmitCheckin() {
      const desc = document.getElementById('modalTaskDesc').value;
      if (!desc) return Swal.fire('提示', '請填寫任務描述說明！', 'warning');

      const photoFile = document.getElementById('modalPhotoInput').files[0];
      if (!photoFile) return Swal.fire('提示', '請上傳證明照片！', 'warning');

      if (!activeTask) return Swal.fire('錯誤', '任務資料遺失，請重新點擊！', 'error');
      const currentTask = activeTask;
      closeModal();

      Swal.fire({ title: '壓縮與上傳中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const photoBase64 = await compressImage(photoFile);

        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submit',
            items: [currentTask.name],
            points: currentTask.pts,
            photoBase64: photoBase64,
            desc: desc
          })
        });

        Swal.fire('提交成功！', '請等待女友審核發放點數～', 'success');
        loadData();
      } catch (err) {
        Swal.fire('提交失敗', `錯誤訊息：${err.message || err}`, 'error');
      }
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        userLogs = data.logs || [];
        storeProducts = data.products || [];
      } catch (e) {
        console.warn("後端 API 取得失敗");
      }

      let currentPts = 0;
      let auditHtml = '';
      let redeemHtml = '';
      let inventoryHtml = '';

      userLogs.slice().reverse().forEach(log => {
        const pts = parseFloat(log.points || 0);
        const formattedDate = formatDate(log.date);

        if (log.status === 'Approved') {
          currentPts += pts;
        }

        if (log.status === 'Pending' && pts > 0 && currentRole === 'gf') {
          auditHtml += `
            <div style="border-bottom: 1px solid #edf2f7; padding: 10px 0;">
              <p style="margin:2px 0;"><b>時間：</b>${formattedDate}</p>
              <p style="margin:2px 0;"><b>項目：</b>${log.items} (+${pts}點)</p>
              <p style="margin:2px 0;"><b>說明：</b>${log.desc || '無'}</p>
              ${log.photoUrl ? `<a href="${log.photoUrl}" target="_blank"><img src="${log.photoUrl}" style="max-width:100%; border-radius:8px; margin-top:5px;"></a>` : ''}
              <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn btn-success btn-sm" style="flex:1;" onclick="audit('${log.id}', 'approve')">同意 ✅</button>
                <button class="btn btn-danger btn-sm" style="flex:1;" onclick="audit('${log.id}', 'reject')">退件 ❌</button>
              </div>
            </div>
          `;
        }

        const isLotteryItem = log.items && log.items.includes('[抽獎獲得]');
        if (log.status === 'Pending' && (pts < 0 || isLotteryItem) && currentRole === 'gf') {
          const ptsText = isLotteryItem ? '免費抽獎獲得' : `扣除 ${Math.abs(pts)} 點`;
          redeemHtml += `
            <div style="border-bottom: 1px solid #edf2f7; padding: 10px 0;">
              <p style="margin:2px 0;"><b>時間：</b>${formattedDate}</p>
              <p style="margin:2px 0;"><b>申請履約：</b>${log.items} (${ptsText})</p>
              <button class="btn btn-success btn-sm" onclick="audit('${log.id}', 'approve')" style="margin-top:5px;">完成履約 ✅</button>
            </div>
          `;
        }

        if (pts < 0 || isLotteryItem) {
          const isApproved = log.status === 'Approved';
          const badgeClass = isApproved ? 'bg-approved' : 'bg-pending';
          const badgeText = isApproved ? '已完成' : '待履行';

          inventoryHtml += `
            <div class="task-item">
              <div class="task-info">
                <span class="task-title">🎁 ${log.items}</span>
                <span class="task-sub">申請時間：${formattedDate}</span>
              </div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
          `;
        }
      });

      document.getElementById('totalPoints').innerText = currentPts;
      document.getElementById('auditList').innerHTML = auditHtml || '<p style="color:#718096;">目前沒有待審核的打卡～</p>';
      document.getElementById('redeemList').innerHTML = redeemHtml || '<p style="color:#718096;">目前沒有待履約的兌換～</p>';
      document.getElementById('inventoryList').innerHTML = inventoryHtml || '<p style="color:#718096;">倉庫空空如也～</p>';

      renderTasks();
      renderStore();
      renderGfStoreAdmin();
      checkWheelMilestone(currentPts);
    }

    // 繪製轉盤 (確保從 0 度順時針繪製)
    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const numPrizes = PRIZES.length;
      const arcSize = (2 * Math.PI) / numPrizes;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numPrizes; i++) {
        const angle = i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = PRIZES[i].color;
        ctx.moveTo(140, 140);
        ctx.arc(140, 140, 130, angle, angle + arcSize);
        ctx.lineTo(140, 140);
        ctx.fill();

        // 繪製獎項文字
        ctx.save();
        ctx.translate(140, 140);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(PRIZES[i].name.substring(0, 8), 120, 4);
        ctx.restore();
      }
    }

    // 旋轉轉盤與對齊邏輯
    let currentRotation = 0; // 記錄當前轉盤角度

    function checkWheelMilestone(currentPts) {
      // 1. 必須是阿寶權限，且點數大於 0
      if (currentRole !== 'bf' || currentPts <= 0) return;

      // 2. 檢查是否正好是 30 的倍數 (30, 60, 90, 120...)
      const isMultipleOf30 = (currentPts % 30 === 0);
      const lastDrawnMilestone = parseInt(localStorage.getItem('last_wheel_milestone') || '0');

      // 3. 只有「正好是 30 倍數」且「該倍數點數大於上一次抽過的關卡」才觸發
      if (isMultipleOf30 && currentPts > lastDrawnMilestone) {
        pendingMilestone = currentPts;
        document.getElementById('wheelModal').classList.remove('hidden');
        drawWheel();
      }
    }

    function getRandomPrizeByWeight() {
      const totalWeight = PRIZES.reduce((sum, p) => sum + p.weight, 0);
      let rand = Math.random() * totalWeight;

      for (let i = 0; i < PRIZES.length; i++) {
        if (rand < PRIZES[i].weight) {
          return { prize: PRIZES[i], index: i };
        }
        rand -= PRIZES[i].weight;
      }
      return { prize: PRIZES[0], index: 0 };
    }

    // 3. 旋轉與結果處置
    function spinWheel() {
      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;

      const { prize, index } = getRandomPrizeByWeight();
      const numPrizes = PRIZES.length;
      const arcDegrees = 360 / numPrizes;

      const targetDegree = (270 - (index * arcDegrees + arcDegrees / 2) + 360) % 360;
      const additionalRotation = 1800 + ((targetDegree - (currentRotation % 360) + 360) % 360);
      currentRotation += additionalRotation;

      const canvas = document.getElementById('wheelCanvas');
      canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(async () => {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

        // 免費再抽一次：當場保持 Modal 繼續連抽
        if (prize.name === '免費再抽一次') {
          Swal.fire({
            title: '🎉 幸運爆棚！',
            text: '抽中【免費再抽一次】！請當場再轉一次！',
            icon: 'success',
            confirmButtonText: '繼續抽獎'
          }).then(() => {
            spinBtn.disabled = false;
          });
          return;
        }

        if (!isStorePaidWheel && pendingMilestone > 0) {
          localStorage.setItem('last_wheel_milestone', pendingMilestone.toString());
        }

        // 💡 獎品寫入 0 點，紀錄為 Pending (女友端完成履約時只變更狀態，絕對不二次扣點)
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submit',
            items: [`[抽獎獲得] ${prize.name}`],
            points: 0, 
            desc: isStorePaidWheel ? '商店 5 點轉盤獲得' : `達標 ${pendingMilestone} 點免費轉盤獲得`
          })
        });

        document.getElementById('wheelModal').classList.add('hidden');
        canvas.style.transition = 'none';
        canvas.style.transform = 'rotate(0deg)';
        currentRotation = 0;
        spinBtn.disabled = false;
        isStorePaidWheel = false;

        Swal.fire('🎉 抽獎結果', `恭喜指針停在：<b>${prize.name}</b>！已放入倉庫～`, 'success');
        loadData();
      }, 4200);
    }

    async function adjustPointsModal() {
      const { value: formValues } = await Swal.fire({
        title: '手動儲值',
        html:
          '<input id="swal-pts" type="number" class="swal2-input" placeholder="輸入數值 (如 +5 或 -3)">' +
          '<input id="swal-reason" type="text" class="swal2-input" placeholder="輸入原因">',
        focusConfirm: false,
        showCancelButton: true,
        preConfirm: () => [
          document.getElementById('swal-pts').value,
          document.getElementById('swal-reason').value
        ]
      });

      if (formValues) {
        const pts = parseFloat(formValues[0]);
        const reason = formValues[1];
        if (isNaN(pts) || !reason) return Swal.fire('提示', '請填寫正確點數與原因！', 'warning');

        Swal.fire({ title: '調整中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submit',
            items: [`[手動調整] ${reason}`],
            points: pts,
            desc: `調整點數：${pts}`
          })
        });

        Swal.fire('完成', '點數已調整！', 'success');
        loadData();
      }
    }

    async function audit(id, auditAction) {
      let reason = '';
      if (auditAction === 'reject') {
        const { value: text } = await Swal.fire({
          title: '退件原因',
          input: 'text',
          showCancelButton: true
        });
        if (!text) return;
        reason = text;
      }

      Swal.fire({ title: '更新狀態中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'audit', id: id, auditAction: auditAction, reason: reason })
      });
      Swal.fire('完成', '狀態已更新！', 'success');
      loadData();
    }

    async function redeem(name, pts) {
      const currentPts = parseFloat(document.getElementById('totalPoints').innerText);
      if (currentPts < pts) return Swal.fire('點數不足', `需要 ${pts} 點，目前僅有 ${currentPts} 點`, 'warning');

      Swal.fire({
        title: '確認兌換？',
        text: `將申請兌換【${name}】(預扣 ${pts} 點)`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '確認兌換'
      }).then(async (res) => {
        if (res.isConfirmed) {
          Swal.fire({ title: '送出申請中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'redeem', rewardName: name, points: pts })
          });
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          Swal.fire('兌換申請已送出！', '請等待女友審核與履約～', 'success');
          loadData();
        }
      });
    }

    function switchBfTab(tab) {
      ['Checkin', 'Store', 'Inventory'].forEach(t => {
        document.getElementById('tabBf' + t).classList.add('hidden');
        document.getElementById('navBf' + t).classList.remove('active');
      });
      document.getElementById('tabBf' + tab).classList.remove('hidden');
      document.getElementById('navBf' + tab).classList.add('active');
    }

    function switchGfTab(tab) {
      ['Audit', 'Redeem', 'ManageStore'].forEach(t => {
        document.getElementById('tabGf' + t).classList.add('hidden');
        document.getElementById('navGf' + t).classList.remove('active');
      });
      document.getElementById('tabGf' + tab).classList.remove('hidden');
      document.getElementById('navGf' + tab).classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    initView();
  </script>
